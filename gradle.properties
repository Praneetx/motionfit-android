# Project-wide Gradle settings.

# Give the build enough memory for Android resource + Kotlin compilation.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Use AndroidX libraries (required for modern Android support libraries).
android.useAndroidX=true

# Generate per-module R classes (smaller, faster builds).
android.nonTransitiveRClass=true

# Build independent modules in parallel and reuse build outputs.
org.gradle.parallel=true
org.gradle.caching=true

# Incremental Kotlin compilation is handled by AGP's built-in Kotlin support.
