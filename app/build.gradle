// Build configuration for the :app module (the Fitness Tracker application).
//
// Language setup:
//   * Java  -> src/main/java  (activities, database, repositories, utilities)
//   * Kotlin-> src/main/kotlin (goal progress + activity summary calculations)
//
// AGP 9.x includes "built-in Kotlin" support, so Kotlin files are compiled by
// the Android plugin itself. We only need to add the Kotlin source directory to
// the module's source set below; there is no separate Kotlin Gradle plugin.

plugins {
    id 'com.android.application'
}

android {
    // Java package used for the generated R class and manifest namespace.
    namespace 'io.github.praneetx.motionfit'

    // compileSdk 37 is the Android platform installed on this machine.
    compileSdk 37

    defaultConfig {
        applicationId "io.github.praneetx.motionfit"
        minSdk 26              // Android 8.0 - gives us java.time and notification channels natively
        targetSdk 34           // kept at 34 so the simple XML UI is not forced into edge-to-edge mode
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Make the Kotlin folder a first-class source directory for both languages.
    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
    }
}

dependencies {
    // Native XML / Material UI + scrollable lists.
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Local JVM unit tests (no Android device required).
    testImplementation 'junit:junit:4.13.2'

    // Instrumented tests that run on an emulator / device.
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
